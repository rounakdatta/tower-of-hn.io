<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Tower of HN — reply sheet (test harness)</title>
<!-- app style -->
<style>
  /* the room, reduced to what a reply needs: people to answer, and the note that says your reply landed */
  body.harness { overflow:auto; background:radial-gradient(120% 80% at 50% 0%, #1b2033, #070a14) }
  #room { max-width:560px; margin:0 auto; padding:24px 18px 360px }
  @media (min-width: 900px) { #room { margin:0 0 0 24px } }   /* (the sheet docks at the right there: people stay in reach) */
  #room h1 { font-size:15px; color:var(--mute); font-weight:600; margin:0 0 14px }
  #room .turn { display:flex; justify-content:space-between; align-items:center; gap:12px; padding:12px 14px; margin:0 0 10px; border:1px solid var(--line); border-radius:14px; background:var(--glass) }
  #room .turn p { margin:0; color:#d9cfc4 } #room .turn b { color:var(--ink) }
  #room .turn button { flex:none; padding:7px 14px; border:0; border-radius:999px; background:var(--ink); color:#15110d; font:inherit; font-weight:700; cursor:pointer }
  #toast { position:fixed; left:50%; top:16px; transform:translateX(-50%); padding:9px 14px; border-radius:10px; background:var(--glass); border:1px solid var(--line); opacity:0; z-index:4 }
  #toast.show { opacity:1 } #toast b { color:#ffd2a8 }
</style>
</head>
<body class="harness" data-mode="table">
<div id="toast" role="status"></div>
<main id="room">
  <h1>Show HN: A tower you can walk into</h1>
  <div class="turn"><p><b>bob</b> · The borrow checker is the reason this compiles at all…</p><button type="button" data-reply="bob">Reply</button></div>
  <div class="turn"><p><b>carol</b> · I disagree: LLVM is why it is fast…</p><button type="button" data-reply="carol">Reply</button></div>
  <div class="turn"><p><b>dave</b> · (a thread from two weeks ago)</p><button type="button" data-reply="dave">Reply</button></div>
  <div class="turn"><p><b>[deleted]</b></p><button type="button" data-reply="gone">Reply</button></div>
</main>
<script type="module" src="./main.ts"></script>
</body>
</html>
