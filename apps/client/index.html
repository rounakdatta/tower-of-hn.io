<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#070a14">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="TowerOfHan">
<title>TowerOfHan — Hacker News, as a living tower</title>
<style>
  :root { --ink:#efe9e0; --mute:#9aa3b6; --line:rgba(255,255,255,.09); --glass:rgba(12,14,22,.62); --hn:#ff6a1a;
          --sans: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Inter, Roboto, sans-serif; }
  * { box-sizing: border-box }
  html, body { margin:0; height:100%; background:#070a14; color:var(--ink); font:14px/1.45 var(--sans); overflow:hidden; -webkit-font-smoothing:antialiased }
  canvas { display:block; width:100%; height:100%; touch-action:none; outline:none }
  a { color:inherit }
  button { font:inherit; color:inherit }

  #brand { position:fixed; left:max(22px, env(safe-area-inset-left)); top:max(18px, env(safe-area-inset-top)); pointer-events:none; text-shadow:0 1px 12px rgba(0,0,0,.6); z-index:3 }
  #scrim { position:fixed; left:0; right:0; top:0; height:calc(124px + env(safe-area-inset-top)); background:linear-gradient(rgba(5,7,14,.82), rgba(5,7,14,.5) 55%, rgba(5,7,14,0));
           pointer-events:none; z-index:2; transition:opacity .6s }
  body[data-mode="table"] #scrim { opacity:0 }
  #brand .w { font-size:17px; font-weight:650; letter-spacing:.2px; color:#fff3ea; text-shadow:0 0 6px rgba(255,154,107,.55), 0 0 18px rgba(255,120,60,.25), 0 1px 12px rgba(0,0,0,.6);
              animation:ignite 1.5s steps(1) .4s both }
  #brand .w i { font-style:normal; color:var(--hn); text-shadow:0 0 8px rgba(255,90,10,.8), 0 0 22px rgba(255,90,10,.35); animation:buzz 11s steps(1) 3s infinite }
  @keyframes ignite { 0% { opacity:.12 } 8% { opacity:1 } 14% { opacity:.2 } 22% { opacity:.9 } 27% { opacity:.3 } 40%, 100% { opacity:1 } }
  @keyframes buzz { 0%, 91% { opacity:1 } 92% { opacity:.25 } 93% { opacity:1 } 94.5% { opacity:.35 } 95.5%, 100% { opacity:1 } }
  @media (prefers-reduced-motion: reduce) { #brand .w, #brand .w i { animation:none } }
  #live { margin-top:3px; font-size:12px; color:var(--mute); font-variant-numeric:tabular-nums }
  #live::before { content:''; display:inline-block; width:6px; height:6px; border-radius:50%; background:#3ddc84; margin-right:7px; vertical-align:1px; box-shadow:0 0 0 0 rgba(61,220,132,.6); animation:pulse 2s infinite }
  @keyframes pulse { 0% { box-shadow:0 0 0 0 rgba(61,220,132,.55) } 70% { box-shadow:0 0 0 7px rgba(61,220,132,0) } 100% { box-shadow:0 0 0 0 rgba(61,220,132,0) } }

  #lean { position:fixed; right:max(20px, env(safe-area-inset-right)); top:max(18px, env(safe-area-inset-top)); background:var(--glass); border-color:var(--line); backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px); z-index:3 }
  body:not([data-mode="tower"]) #lean { display:none }
  #tip { position:fixed; left:0; top:0; display:flex; gap:12px; max-width:360px; padding:12px 14px; border-radius:12px; background:var(--glass); border:1px solid var(--line);
         backdrop-filter:blur(14px) saturate(1.2); -webkit-backdrop-filter:blur(14px); opacity:0; transition:opacity .15s; pointer-events:none; box-shadow:0 12px 40px rgba(0,0,0,.35) }
  #tip.show { opacity:1 }
  #tip .rank, .rank { color:var(--hn); font-weight:700; font-variant-numeric:tabular-nums }
  #tip .rank { font-size:20px; line-height:1.1; min-width:24px; text-align:right }
  #tip .t { font-weight:600; font-size:14px }
  #tip .m { color:var(--mute); font-size:12px; margin-top:3px }
  #tip .m b { color:#ffd2a8; font-weight:600 }

  #focus { position:fixed; left:12px; right:12px; bottom:calc(12px + env(safe-area-inset-bottom)); display:flex; gap:14px; align-items:flex-start; padding:14px 14px 14px 12px;
           border-radius:16px; background:var(--glass); border:1px solid var(--line); backdrop-filter:blur(16px) saturate(1.2); -webkit-backdrop-filter:blur(16px) saturate(1.2);
           box-shadow:0 14px 44px rgba(0,0,0,.4); z-index:3; opacity:0; transform:translateY(12px); transition:opacity .35s, transform .35s; pointer-events:none; cursor:pointer; text-align:left; width:auto }
  #focus.show { opacity:1; transform:none; pointer-events:auto }
  body:not([data-mode="tower"]) #focus { opacity:0; pointer-events:none; transform:translateY(12px) }
  #focus .rank { font-size:30px; line-height:1.02; font-weight:750; min-width:34px; text-align:right }
  #focus .body { min-width:0; flex:1 }
  #focus .t { font-size:17px; font-weight:650; line-height:1.28; letter-spacing:-.1px; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden }
  #focus .m { color:var(--mute); font-size:12.5px; margin-top:5px; font-variant-numeric:tabular-nums; white-space:nowrap; overflow:hidden; text-overflow:ellipsis }
  #focus .m b { color:#ffd2a8; font-weight:600 }
  #focus .crowd { color:var(--ink); font-weight:600 } #focus .crowd svg { width:13px; height:13px; fill:var(--hn); vertical-align:-2px; margin-right:4px }
  #focus .go { display:inline-flex; flex:none; white-space:nowrap; align-items:center; gap:8px; margin-top:11px; border:0; border-radius:999px; padding:9px 16px 9px 15px; background:var(--ink); color:#15110d; font-weight:700; font-size:14px; cursor:pointer }
  #focus .go svg { width:15px; height:15px }
  #focus .act { display:flex; align-items:center; gap:12px; margin-top:11px }
  #focus .act .go { margin-top:0 }
  #focus .fhint { display:none; color:var(--mute); font-size:12px; line-height:1.3 }
  #focus.first .fhint { display:block }
  #focus:hover .go, #focus .go:focus-visible { background:#fff }
  #elevator { position:fixed; right:max(6px, env(safe-area-inset-right)); top:max(96px, 15vh); bottom:calc(168px + env(safe-area-inset-bottom)); width:34px; display:flex; flex-direction:column; justify-content:space-between;
              align-items:flex-end; padding:2px 8px 2px 0; z-index:3; touch-action:none; cursor:ns-resize; opacity:0; transition:opacity .4s; outline:none }
  #elevator.show { opacity:1 }
  body:not([data-mode="tower"]) #elevator { opacity:0; pointer-events:none }
  #elevator i { display:block; width:8px; height:2px; border-radius:1px; background:rgba(255,255,255,.22); transition:width .2s, background .2s }
  #elevator i.hot { background:rgba(255,214,180,.62) }
  #elevator i.on { width:18px; background:var(--hn); box-shadow:0 0 8px rgba(255,106,26,.6) }
  #elevator .num { position:absolute; right:30px; transform:translateY(-50%); padding:1px 6px; border-radius:6px; background:rgba(8,10,16,.72); font-size:12px; font-weight:700; color:var(--hn);
                   font-variant-numeric:tabular-nums; pointer-events:none; transition:top .15s }
  #elevator:focus-visible i.on { outline:2px solid #fff; outline-offset:3px }
  @media (min-width: 900px) and (min-height: 560px) {
    #focus { left:24px; right:auto; bottom:24px; width:min(520px, 42vw) }
    #elevator { right:14px; top:18vh; bottom:18vh }
  }
  @media (max-height: 480px) {
    #focus { padding:10px 12px; left:auto; right:56px; width:min(440px, 52vw); bottom:10px } #focus .t { -webkit-line-clamp:1; font-size:15px } #focus .act { margin-top:7px } #focus .go { padding:6px 13px }
    #elevator { top:58px; bottom:10px }
  }
  #floorbar { position:fixed; z-index:3; left:50%; top:max(16px, env(safe-area-inset-top)); transform:translate(-50%,-8px); display:flex; align-items:center; gap:14px; max-width:min(860px, 92vw);
              padding:9px 10px 9px 16px; border-radius:999px; background:var(--glass); border:1px solid var(--line); backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px);
              opacity:0; pointer-events:none; transition:opacity .4s, transform .4s }
  #floorbar.show { opacity:1; transform:translate(-50%,0); pointer-events:auto }
  #ftitle { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; font-weight:600 }
  #ftitle a { text-decoration:none } #ftitle a:hover { text-decoration:underline }
  .pill { flex:none; border:1px solid var(--line); background:rgba(255,255,255,.06); border-radius:999px; padding:6px 13px; cursor:pointer; font-size:13px }
  .pill:hover { background:rgba(255,255,255,.12) }

  /* table signs: what a table is about, in its mood's colour; who's speaking, and how */
  #labels .tlabel { position:fixed; left:0; top:0; display:flex; flex-direction:column; align-items:center; gap:2px; padding:6px 11px 7px; border-radius:11px;
    white-space:nowrap; max-width:min(360px, 78vw); background:rgba(14,12,12,.58); border:1px solid rgba(255,235,215,.12); color:#f6ece2; font:inherit;
    box-shadow:0 6px 22px rgba(0,0,0,.28); backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px); cursor:pointer; visibility:hidden; will-change:transform }
  #labels .tlabel.on { visibility:visible }
  #labels .tlabel .gist { display:block; max-width:100%; overflow:hidden; text-overflow:ellipsis; font-size:13px; font-weight:600; letter-spacing:.005em }
  #labels .tlabel .dot { display:inline-block; width:7px; height:7px; border-radius:50%; margin:0 7px 1px 0; vertical-align:middle; box-shadow:0 0 8px currentColor }
  #labels .tlabel .meta { color:#c9b6a3; font-size:11.5px }
  #labels .tlabel em { font-style:normal; font-weight:650; color:#e8dccf }
  #labels .tlabel:hover { background:rgba(40,24,14,.82); border-color:rgba(255,170,110,.4) }
  #labels .tlabel.focus { background:rgba(22,16,12,.78); border-color:rgba(255,220,190,.32); box-shadow:0 8px 28px rgba(0,0,0,.4) }
  #labels .tlabel.talk .dot { animation:talk 1.1s ease-in-out infinite }
  @keyframes talk { 50% { transform:scale(1.5); opacity:.75 } }
  #labels .tlabel.best { border-color:rgba(255,140,70,.7); background:rgba(40,20,10,.74); box-shadow:0 0 0 1px rgba(255,106,26,.25), 0 8px 26px rgba(0,0,0,.35) }
  #labels .tlabel .kick { font-style:normal; font-size:10.5px; font-weight:750; letter-spacing:.06em; text-transform:uppercase; color:var(--hn) }
  #labels { opacity:0; transition:opacity .6s }
  #labels.show { opacity:1 }
  @media (max-width: 699px) { #labels .tlabel .gist { font-size:12px } #labels .tlabel .meta { font-size:11px } }
  /* the floor at a glance (minimap): top right, out of both thumbs' way */
  #map { position:fixed; right:12px; top:calc(env(safe-area-inset-top) + 74px); width:150px; height:150px; z-index:4; border-radius:50%;
    opacity:0; pointer-events:none; transition:opacity .5s; cursor:pointer; filter:drop-shadow(0 6px 18px rgba(0,0,0,.35)) }
  #map.show { opacity:1; pointer-events:auto }
  @media (max-width: 699px) { #map { width:96px; height:96px; right:10px; top:calc(env(safe-area-inset-top) + 70px) } }
  #map.big { width:min(86vw, 440px); height:min(86vw, 440px); right:auto; left:50%; top:50%; transform:translate(-50%, -50%); z-index:9;
    box-shadow:0 0 0 100vmax rgba(0,0,0,.5) }
  body:not([data-mode="floor"]) #map { opacity:0; pointer-events:none }
  body:not([data-mode="floor"]) #labels { display:none }

  .lb { position:fixed; left:0; right:0; height:0; background:#000; transition:height .9s cubic-bezier(.2,.8,.2,1); pointer-events:none; z-index:2 }
  #lbt { top:0 } #lbb { bottom:0 }
  body[data-mode="table"] .lb { height:8.5vh }
  @media (max-aspect-ratio: 4/5) { body[data-mode="table"] .lb { height:6.5vh } }
  #brand { transition:opacity .6s } body[data-mode="table"] #brand { opacity:0 }
  body[data-mode="table"] #floorbar { top:calc(8.5vh / 2 - 17px); padding:4px 5px 4px 14px; background:rgba(255,255,255,.05); font-size:13px }
  body[data-mode="table"] #floorbar .pill { padding:4px 11px; font-size:12px }

  #subs { position:fixed; left:50%; bottom:calc(8.5vh + 22px); transform:translateX(-50%); width:min(880px, 92vw); text-align:center; z-index:3; pointer-events:none;
          opacity:0; transition:opacity .25s; font-size:clamp(16px, 2.1vw, 21px); line-height:1.42; text-shadow:0 2px 6px rgba(0,0,0,.9), 0 0 24px rgba(0,0,0,.7) }
  #subs.show { opacity:1 }
  #subs .who { font-weight:700; margin-right:.55em; letter-spacing:.2px }
  #subs .said { color:#f6f2ea; transition:color .4s }
  #subs[data-tone="angry"] .said { color:#ffe0d6; text-shadow:0 0 22px rgba(255,90,50,.28), 0 1px 3px rgba(0,0,0,.85) }
  #subs .to { color:#b9b2a6; font-weight:500 }
  body:not([data-mode="table"]) #subs { bottom:calc(124px + env(safe-area-inset-bottom)); font-size:15.5px; width:min(760px, 92vw) }
  @media (max-width: 699px) {
    /* a phone's bottom: the button at the edge, three lines of subtitle above it, the hint up under the title bar */
    body:not([data-mode="table"]) #subs { bottom:calc(84px + env(safe-area-inset-bottom)); font-size:15px; line-height:1.38; display:-webkit-box; -webkit-line-clamp:3;
      -webkit-box-orient:vertical; overflow:hidden; z-index:6 }
    #sitdown { white-space:nowrap; max-width:84vw; overflow:hidden; text-overflow:ellipsis }
    body[data-mode="floor"] #sitdown { bottom:calc(24px + env(safe-area-inset-bottom)) }
    body[data-mode="floor"] #hint { top:calc(env(safe-area-inset-top) + 70px); left:12px; bottom:auto; transform:none; width:calc(100vw - 130px); text-align:left; white-space:normal }
  }
  #subs .how { display:inline-block; font-size:.72em; font-weight:650; letter-spacing:.04em; text-transform:uppercase; padding:1px 7px 2px; margin:0 .6em .15em 0;
    border:1px solid; border-radius:999px; vertical-align:middle; background:rgba(0,0,0,.25) }

  #placard { position:fixed; left:0; top:0; z-index:3; display:inline-flex; gap:8px; align-items:center; padding:8px 13px; border-radius:8px; background:#f4ecdf; color:#1d150f;
             font-weight:650; text-decoration:none; box-shadow:0 10px 30px rgba(0,0,0,.45); opacity:0; transition:opacity .25s; transform-origin:center }
  #placard.show { opacity:1 } #placard .ico { color:var(--hn) }
  #code { position:fixed; left:24px; bottom:calc(8.5vh + 90px); max-width:min(560px, 80vw); max-height:30vh; overflow:hidden; z-index:3; margin:0; padding:14px 16px; border-radius:10px;
          background:rgba(20,26,22,.9); color:#d6f5d0; font:12.5px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace; white-space:pre-wrap; opacity:0; transition:opacity .3s; pointer-events:none }
  #code.show { opacity:1 }
  #waiting { position:fixed; left:0; top:0; z-index:3; padding:5px 11px; border-radius:999px; background:rgba(255,255,255,.92); color:#222; font-weight:800; letter-spacing:2px; opacity:0; transition:opacity .3s }
  #waiting.show { opacity:1; animation:bob 1.2s ease-in-out infinite }
  @keyframes bob { 50% { margin-top:-4px } }

  #hint { position:fixed; left:50%; bottom:18px; transform:translateX(-50%); color:var(--mute); font-size:12.5px; pointer-events:none; text-shadow:0 1px 8px #000; z-index:3; white-space:nowrap }
  body[data-mode="table"] #hint { bottom:calc(8.5vh / 2 - 9px) }
  #controls { position:fixed; right:18px; bottom:calc(8.5vh / 2 - 16px + env(safe-area-inset-bottom) / 2); display:none; gap:8px; z-index:4 }
  body[data-mode="table"] #controls { display:flex }
  #controls .pill { background:rgba(255,255,255,.08); border-color:rgba(255,255,255,.14) }

  #sitdown { position:fixed; left:50%; bottom:calc(64px + env(safe-area-inset-bottom)); transform:translate(-50%, 8px); z-index:4; opacity:0; pointer-events:none;
             background:var(--ink); color:#15110d; border:0; font-weight:700; padding:11px 20px; box-shadow:0 10px 30px rgba(0,0,0,.4); transition:opacity .25s, transform .25s }
  #sitdown.show { opacity:1; transform:translate(-50%, 0); pointer-events:auto }
  #sitdown:hover { background:#fff }
  body:not([data-mode="floor"]) #sitdown, body.card-open #sitdown { opacity:0; pointer-events:none }
  #sitdown kbd { font:600 11px/1 ui-monospace, SFMono-Regular, Menlo, monospace; padding:3px 6px; margin-left:6px; border-radius:5px; background:rgba(0,0,0,.08); border:1px solid rgba(0,0,0,.15) }
  /* first person at a desk: a quiet aiming dot, and what a click would do */
  #reticle { position:fixed; left:50%; top:50%; width:6px; height:6px; margin:-3px 0 0 -3px; border-radius:50%; background:rgba(255,255,255,.85);
    box-shadow:0 0 0 1.5px rgba(0,0,0,.45), 0 0 10px rgba(0,0,0,.4); z-index:4; pointer-events:none; opacity:0; transition:opacity .2s }
  body.fps[data-mode="floor"] #reticle { opacity:1 }
  #aim { position:fixed; left:50%; top:calc(50% + 16px); transform:translateX(-50%); padding:4px 10px; border-radius:999px; background:rgba(10,12,18,.62);
    color:#f3e9de; font-size:12.5px; white-space:nowrap; pointer-events:none; z-index:4; opacity:0; transition:opacity .15s; backdrop-filter:blur(6px) }
  body.fps[data-mode="floor"] #aim.show { opacity:1 }
  /* without the capture, the same tag follows the mouse over someone (desktop) */
  @media (hover: hover) { body:not(.fps)[data-mode="floor"] #aim.show { opacity:1 } }
  body.fps #aim { left:50% !important; top:calc(50% + 16px) !important }
  /* the thumb stick (phones): a ring where the thumb landed, a knob under it */
  #stick { position:fixed; left:0; top:0; width:116px; height:116px; margin:-58px 0 0 -58px; border-radius:50%; z-index:5; pointer-events:none;
    border:1.5px solid rgba(255,255,255,.28); background:radial-gradient(circle, rgba(255,255,255,.07), rgba(255,255,255,.02) 70%); opacity:0; transition:opacity .18s }
  #stick.show { opacity:1 }
  #stick.ghost { opacity:.55; animation:ghost 2.6s ease-in-out infinite }
  #stick.ghost::after { content:'walk'; position:absolute; left:50%; top:calc(100% + 6px); transform:translateX(-50%); color:rgba(255,255,255,.6); font-size:11px; letter-spacing:.08em; text-transform:uppercase }
  #stick.ghost .knob { animation:nudge 2.6s ease-in-out infinite }
  @keyframes ghost { 50% { opacity:.3 } }
  @keyframes nudge { 0%, 100% { transform:translate(-50%, -50%) } 40% { transform:translate(-50%, -82%) } }
  body:not([data-mode="floor"]) #stick { opacity:0 }
  #stick .knob { position:absolute; left:50%; top:50%; width:48px; height:48px; border-radius:50%; transform:translate(-50%, -50%);
    background:rgba(255,255,255,.82); box-shadow:0 2px 12px rgba(0,0,0,.35) }
  /* a card is open: the hint and (on a phone, where the card spans the screen) the table labels step back */
  body.card-open #hint { opacity:0 }
  @media (max-width: 899px) { body.card-open #labels { opacity:0; pointer-events:none } }
  #profile { position:fixed; left:12px; right:12px; bottom:calc(12px + env(safe-area-inset-bottom)); z-index:6; padding:18px 18px 14px; border-radius:18px; background:rgba(14,16,24,.86);
             border:1px solid var(--line); backdrop-filter:blur(18px) saturate(1.2); -webkit-backdrop-filter:blur(18px) saturate(1.2); box-shadow:0 18px 60px rgba(0,0,0,.5);
             opacity:0; transform:translateY(16px); pointer-events:none; transition:opacity .3s, transform .3s; max-height:min(70vh, 560px); overflow:auto }
  #profile.show { opacity:1; transform:none; pointer-events:auto }
  /* replying, by voice: the same glass as a card; a big microphone that breathes while it listens */
  #reply { position:fixed; left:12px; right:12px; bottom:calc(12px + env(safe-area-inset-bottom)); z-index:7; padding:18px 18px 14px; border-radius:18px; background:rgba(14,16,24,.9);
           border:1px solid var(--line); backdrop-filter:blur(18px) saturate(1.2); -webkit-backdrop-filter:blur(18px) saturate(1.2); box-shadow:0 18px 60px rgba(0,0,0,.55);
           opacity:0; transform:translateY(16px); pointer-events:none; transition:opacity .3s, transform .3s; max-height:min(80vh, 640px); overflow:auto; text-align:center }
  #reply.show { opacity:1; transform:none; pointer-events:auto }
  #reply .x { position:absolute; right:10px; top:8px; width:36px; height:36px; border:0; border-radius:50%; background:rgba(255,255,255,.07); color:var(--mute); font-size:20px; cursor:pointer }
  #reply .to { font-size:15px; color:var(--mute); padding:0 40px } #reply .to b { color:var(--ink) }
  #reply .their { margin:8px 4px 14px; color:#d9cfc4; font-size:14px; line-height:1.45; text-align:left; overflow:hidden; display:-webkit-box; -webkit-line-clamp:4; -webkit-box-orient:vertical }
  #reply .as { color:#ffd2a8; cursor:pointer } #reply .as:hover { text-decoration:underline }
  #reply .mic { position:relative; width:72px; height:72px; border-radius:50%; border:0; margin:2px auto 6px; display:grid; place-items:center; cursor:pointer;
                background:var(--hn); color:#fff; box-shadow:0 10px 30px rgba(255,106,26,.35) }
  #reply .mic svg { width:30px; height:30px; position:relative }
  #reply .mic .ring { position:absolute; inset:-8px; border-radius:50%; border:2px solid rgba(255,106,26,.55); opacity:0 }
  #reply.listening .mic { background:#ff4d3a } #reply.listening .mic .ring { animation:listen 1.3s ease-out infinite }
  @keyframes listen { 0% { transform:scale(.9); opacity:.9 } 100% { transform:scale(1.35); opacity:0 } }
  #reply .state { font-size:12.5px; color:var(--mute); margin-bottom:10px; min-height:1.2em }
