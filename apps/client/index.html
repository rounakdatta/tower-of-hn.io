<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#070a14">
<title>TowerOfHan — Hacker News, as a living tower</title>
<style>
  :root { --ink:#efe9e0; --mute:#9aa3b6; --line:rgba(255,255,255,.09); --glass:rgba(12,14,22,.62); --hn:#ff6a1a;
          --sans: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Inter, Roboto, sans-serif; }
  * { box-sizing: border-box }
  html, body { margin:0; height:100%; background:#070a14; color:var(--ink); font:14px/1.45 var(--sans); overflow:hidden; -webkit-font-smoothing:antialiased }
  canvas { display:block; width:100%; height:100%; touch-action:none; outline:none }
  a { color:inherit }
  button { font:inherit; color:inherit }

  #brand { position:fixed; left:22px; top:18px; pointer-events:none; text-shadow:0 1px 12px rgba(0,0,0,.6) }
  #brand .w { font-size:17px; font-weight:650; letter-spacing:.2px }
  #brand .w i { font-style:normal; color:var(--hn) }
  #live { margin-top:3px; font-size:12px; color:var(--mute); font-variant-numeric:tabular-nums }
  #live::before { content:''; display:inline-block; width:6px; height:6px; border-radius:50%; background:#3ddc84; margin-right:7px; vertical-align:1px; box-shadow:0 0 0 0 rgba(61,220,132,.6); animation:pulse 2s infinite }
  @keyframes pulse { 0% { box-shadow:0 0 0 0 rgba(61,220,132,.55) } 70% { box-shadow:0 0 0 7px rgba(61,220,132,0) } 100% { box-shadow:0 0 0 0 rgba(61,220,132,0) } }

  #lean { position:fixed; right:20px; top:18px; background:var(--glass); border-color:var(--line); backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px); z-index:3 }
  body:not([data-mode="tower"]) #lean { display:none }
  #tip { position:fixed; left:0; top:0; display:flex; gap:12px; max-width:360px; padding:12px 14px; border-radius:12px; background:var(--glass); border:1px solid var(--line);
         backdrop-filter:blur(14px) saturate(1.2); -webkit-backdrop-filter:blur(14px); opacity:0; transition:opacity .15s; pointer-events:none; box-shadow:0 12px 40px rgba(0,0,0,.35) }
  #tip.show { opacity:1 }
  #tip .rank, .rank { color:var(--hn); font-weight:700; font-variant-numeric:tabular-nums }
  #tip .rank { font-size:20px; line-height:1.1; min-width:24px; text-align:right }
  #tip .t { font-weight:600; font-size:14px }
  #tip .m { color:var(--mute); font-size:12px; margin-top:3px }
  #tip .m b { color:#ffd2a8; font-weight:600 }

  #floorbar { position:fixed; left:50%; top:16px; transform:translate(-50%,-8px); display:flex; align-items:center; gap:14px; max-width:min(860px, 92vw);
              padding:9px 10px 9px 16px; border-radius:999px; background:var(--glass); border:1px solid var(--line); backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px);
              opacity:0; pointer-events:none; transition:opacity .4s, transform .4s }
  #floorbar.show { opacity:1; transform:translate(-50%,0); pointer-events:auto }
  #ftitle { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; font-weight:600 }
  #ftitle a { text-decoration:none } #ftitle a:hover { text-decoration:underline }
  .pill { flex:none; border:1px solid var(--line); background:rgba(255,255,255,.06); border-radius:999px; padding:6px 13px; cursor:pointer; font-size:13px }
  .pill:hover { background:rgba(255,255,255,.12) }

  #labels .tlabel { position:fixed; left:0; top:0; display:flex; flex-direction:column; align-items:center; gap:1px; padding:7px 12px; border-radius:10px; white-space:nowrap;
                    background:rgba(14,10,8,.55); border:1px solid rgba(255,200,150,.14); backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px); cursor:pointer;
                    font-size:12.5px; transition:background .15s, opacity .3s }
  #labels .tlabel span { color:#c9b6a3; font-size:11.5px }
  #labels .tlabel:hover { background:rgba(40,24,14,.8); border-color:rgba(255,170,110,.4) }
  #labels .tlabel.bar { opacity:.9 }
  #labels { opacity:0; transition:opacity .6s }
  #labels.show { opacity:1 }
  #labels .tlabel em { font-style:normal; color:#c9b6a3; font-weight:500 }
  #labels .tlabel .play { font-style:normal; color:var(--hn); font-size:10px; margin-right:6px; vertical-align:1px }
  body:not([data-mode="floor"]) #labels { display:none }

  .lb { position:fixed; left:0; right:0; height:0; background:#000; transition:height .9s cubic-bezier(.2,.8,.2,1); pointer-events:none; z-index:2 }
  #lbt { top:0 } #lbb { bottom:0 }
  body[data-mode="table"] .lb { height:8.5vh }
  body[data-mode="table"] #floorbar { top:calc(8.5vh + 10px) }

  #subs { position:fixed; left:50%; bottom:calc(8.5vh + 22px); transform:translateX(-50%); width:min(880px, 92vw); text-align:center; z-index:3; pointer-events:none;
          opacity:0; transition:opacity .25s; font-size:clamp(16px, 2.1vw, 21px); line-height:1.42; text-shadow:0 2px 6px rgba(0,0,0,.9), 0 0 24px rgba(0,0,0,.7) }
  #subs.show { opacity:1 }
  #subs .who { font-weight:700; margin-right:.55em; letter-spacing:.2px }
  #subs .said { color:#f6f2ea }
  #subs .to { color:#b9b2a6; font-weight:500 }
  body:not([data-mode="table"]) #subs { bottom:28px }

  #placard { position:fixed; left:0; top:0; z-index:3; display:inline-flex; gap:8px; align-items:center; padding:8px 13px; border-radius:8px; background:#f4ecdf; color:#1d150f;
             font-weight:650; text-decoration:none; box-shadow:0 10px 30px rgba(0,0,0,.45); opacity:0; transition:opacity .25s; transform-origin:center }
  #placard.show { opacity:1 } #placard .ico { color:var(--hn) }
  #code { position:fixed; left:24px; bottom:calc(8.5vh + 90px); max-width:min(560px, 80vw); max-height:30vh; overflow:hidden; z-index:3; margin:0; padding:14px 16px; border-radius:10px;
          background:rgba(20,26,22,.9); color:#d6f5d0; font:12.5px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace; white-space:pre-wrap; opacity:0; transition:opacity .3s; pointer-events:none }
  #code.show { opacity:1 }
  #waiting { position:fixed; left:0; top:0; z-index:3; padding:5px 11px; border-radius:999px; background:rgba(255,255,255,.92); color:#222; font-weight:800; letter-spacing:2px; opacity:0; transition:opacity .3s }
  #waiting.show { opacity:1; animation:bob 1.2s ease-in-out infinite }
  @keyframes bob { 50% { margin-top:-4px } }

  #hint { position:fixed; left:50%; bottom:18px; transform:translateX(-50%); color:var(--mute); font-size:12.5px; pointer-events:none; text-shadow:0 1px 8px #000; z-index:3; white-space:nowrap }
  body[data-mode="table"] #hint { bottom:calc(8.5vh / 2 - 9px) }
  #controls { position:fixed; right:18px; bottom:calc(8.5vh / 2 - 16px); display:none; gap:8px; z-index:4 }
  body[data-mode="table"] #controls { display:flex }
  #controls .pill { background:rgba(255,255,255,.08); border-color:rgba(255,255,255,.14) }

  #fade { position:fixed; inset:0; background:#000; opacity:0; pointer-events:none; z-index:5 }
  #fade.go { animation:fade .9s ease }
  @keyframes fade { 0% { opacity:0 } 35% { opacity:1 } 100% { opacity:0 } }
  #card { position:fixed; left:50%; top:40%; transform:translate(-50%,-50%); text-align:center; pointer-events:none; opacity:0; z-index:4; width:min(900px, 90vw);
          text-shadow:0 2px 20px rgba(0,0,0,.85) }
  #card .k { font-size:12px; letter-spacing:4px; text-transform:uppercase; color:#ffb27a; font-weight:700 }
  #card .t { margin-top:10px; font-size:clamp(24px, 4vw, 44px); font-weight:700; letter-spacing:-.5px; line-height:1.12 }
  #card.go { animation:card 3.6s ease forwards }
  @keyframes card { 0% { opacity:0; transform:translate(-50%,-46%) } 18% { opacity:1; transform:translate(-50%,-50%) } 75% { opacity:1 } 100% { opacity:0; transform:translate(-50%,-53%) } }
  #toast { position:fixed; right:20px; top:calc(8.5vh + 16px); padding:9px 14px; border-radius:10px; background:var(--glass); border:1px solid var(--line); z-index:4;
           backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px); opacity:0; transform:translateY(-6px); transition:opacity .3s, transform .3s; pointer-events:none; font-size:13px }
  #toast.show { opacity:1; transform:none } #toast b { color:#ffd2a8 }
  @media (max-width: 700px), (hover: none) {
    body[data-mode="table"] #hint { display:none }
    #controls { right:50%; transform:translateX(50%) }
    #floorbar { padding-left:12px; gap:8px } #back { padding:6px 10px }
    #brand .w { font-size:15px }
    #subs { font-size:15px; width:94vw }
  }
  #splash { position:fixed; inset:0; display:grid; place-items:center; z-index:10; background:radial-gradient(ellipse at 50% 70%, rgba(40,22,10,.35), rgba(5,7,14,.82) 60%);
            opacity:0; pointer-events:none; transition:opacity 1.1s }
  #splash.show { opacity:1; pointer-events:auto }
  #splash .inner { text-align:center; padding:24px; max-width:620px }
  #splash h1 { margin:0; font-size:clamp(34px, 6vw, 58px); font-weight:700; letter-spacing:-1px }
  #splash h1 i { font-style:normal; color:var(--hn) }
  #splash p { color:#c8c1b6; font-size:clamp(14px, 1.8vw, 17px); margin:14px auto 28px; max-width:520px }
  #enter { border:0; border-radius:999px; padding:13px 26px; background:var(--ink); color:#111; font-weight:700; font-size:15px; cursor:pointer; box-shadow:0 10px 40px rgba(255,140,60,.25) }
  #enter:hover { background:#fff }
  #splash small { display:block; margin-top:18px; color:var(--mute) }
</style>
</head>
<body data-mode="tower">
<div id="brand"><div class="w">Tower<i>Of</i>Han</div><div id="live">connecting to Hacker News…</div></div>
<button class="pill" id="lean" title="Hands-free: the liveliest floors and tables, one after another">▶ Lean back</button>
<div id="tip"></div>
<div id="floorbar"><div id="ftitle"></div><button class="pill" id="back">Back</button></div>
<div id="labels"></div>
<div class="lb" id="lbt"></div><div class="lb" id="lbb"></div>
<div id="subs"></div>
<a id="placard" target="_blank" rel="noopener"></a>
<pre id="code"></pre>
<div id="waiting">•••</div>
<div id="hint"></div>
<div id="fade"></div>
<div id="card"></div>
<div id="toast"></div>
<div id="controls"><button class="pill" id="pause">Pause</button><button class="pill" id="next">Next table</button><button class="pill" id="leave">Stand up</button></div>
<div id="splash"><div class="inner">
  <h1>Tower<i>Of</i>Han</h1>
  <p>Hacker News, as a living tower. Every floor is a front-page story. Every table is a thread, and the people at it are talking, in their own words, right now.</p>
  <button id="enter">Enter the tower</button>
  <small>Headphones on. Sound is half of it.</small>
</div></div>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
