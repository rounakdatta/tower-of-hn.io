name: release

# Tests on every push and pull request. A v* tag also publishes both images to GHCR at the
# tag's version (private, like the repository; the homelab pulls them with its ghcr-pull Secret).
# Push the tag on its own: a branch and a tag in one push fire only the branch run.

on:
  push:
    branches: [main, v2]
    tags: ['v*']
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Core tests
        run: node --test packages/core/src/*.test.ts
      - name: Client builds
        working-directory: apps/client
        run: npm ci --no-audit --no-fund && npx vite build
      - name: Worker parses
        run: python3 -c "import ast; ast.parse(open('apps/voice-worker/worker.py').read())"

  images:
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - image: towerofhan-web
            file: deploy/web.Dockerfile
          - image: towerofhan-voice
            file: deploy/voice.Dockerfile
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: v
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.file }}
          push: true
          tags: ghcr.io/rounakdatta/${{ matrix.image }}:${{ steps.v.outputs.version }}
          build-args: VERSION=${{ steps.v.outputs.version }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
