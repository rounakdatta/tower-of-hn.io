name: release

# Tests on every push and pull request. A v* tag also publishes both images to GHCR at the
# tag's version (private, like the repository; the homelab pulls them with its ghcr-pull Secret).
# Push the tag on its own: a branch and a tag in one push fire only the branch run.

on:
  push:
    branches: [main, v2]
    tags: ['v*']
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Core, voice queue, HN formatting and extension tests
        run: node --test packages/core/src/*.test.ts apps/towerd/src/*.test.ts apps/client/src/*.test.ts apps/extension/*.test.ts
      - name: Client builds
        working-directory: apps/client
        # the built page must keep towerd's support markers (HTML comments): a build that dropped them would leave
        # SPONSOR_URL with nothing to fill
        run: |
          npm ci --no-audit --no-fund && npx vite build
          for m in head door table; do grep -q "<!--support:$m-->" dist/index.html || { echo "the build dropped <!--support:$m-->"; exit 1; }; done
      - name: Worker parses
        run: python3 -c "import ast; ast.parse(open('apps/voice-worker/worker.py').read())"

  images:
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        # The packages keep the name the project first went out under: the homelab pins their digests,
        # and the layer cache below lives in them
        include:
          - image: towerofhan-web
            file: deploy/web.Dockerfile
          - image: towerofhan-voice
            file: deploy/voice.Dockerfile
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: v
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.file }}
          push: true
          tags: ghcr.io/rounakdatta/${{ matrix.image }}:${{ steps.v.outputs.version }}
          build-args: VERSION=${{ steps.v.outputs.version }}
          # in the registry, not GitHub's cache: that one is scoped to a ref, and every release is a new tag, so each
          # build started cold and every layer came out new (a worker on a slow link pulled the whole image again)
          cache-from: type=registry,ref=ghcr.io/rounakdatta/${{ matrix.image }}:buildcache
          cache-to: type=registry,ref=ghcr.io/rounakdatta/${{ matrix.image }}:buildcache,mode=max,image-manifest=true,oci-mediatypes=true
